version: '3.8'

services:
  # Redis task queue
  redis:
    image: redis:alpine
    container_name: houdini-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Agent worker (can scale up)
  agent:
    build: .
    depends_on:
      - redis
    environment:
      - DISPLAY=:99
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - AUTO_MODE=true
      - REDIS_URL=redis://redis:6379
      - WORKER_ID=worker-${WORKER_NUM:-1}
      - ENABLE_VNC=false
    volumes:
      # Mount data directory for persistence
      - ./data:/app/data
      # Mount source code for development
      - ./src:/app/src
      # Share generated data across workers
      - shared-data:/app/shared
    shm_size: 2gb  # Increase shared memory for Chrome
    restart: unless-stopped
    deploy:
      replicas: 3  # Run 3 workers in parallel

  # VNC-enabled agent for debugging (optional)
  agent-debug:
    build: .
    depends_on:
      - redis
    environment:
      - DISPLAY=:99
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - AUTO_MODE=false  # Manual mode
      - REDIS_URL=redis://redis:6379
      - WORKER_ID=debug-worker
      - ENABLE_VNC=true
    ports:
      - "5900:5900"  # VNC port
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    shm_size: 2gb
    profiles:
      - debug  # Only start with: docker-compose --profile debug up

volumes:
  redis-data:
  shared-data:

networks:
  default:
    name: houdini-network
