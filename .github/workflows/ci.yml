name: CI

on:
  push:
    branches: [main, master, overhaul/provider-frontend]
  pull_request:
    branches: [main, master, overhaul/provider-frontend]

jobs:
  python:
    name: Python lint & test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pydantic python-dotenv

      - name: Run pytest
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Check Python syntax
        run: |
          find src/ config/ tests/ -name '*.py' -exec python -c "
          import ast, sys
          for f in sys.argv[1:]:
              try:
                  ast.parse(open(f).read())
              except SyntaxError as e:
                  print(f'SYNTAX ERROR in {f}: {e}')
                  sys.exit(1)
          print(f'All {len(sys.argv)-1} files OK')
          " {} +

      - name: Run ruff (lint)
        run: |
          pip install ruff
          ruff check src/ config/ tests/ --select E,F,W --ignore E501,E402,F401 --exit-zero

  frontend:
    name: Frontend build & type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm install --prefix frontend

      - name: Type check frontend
        run: |
          if npm run type-check --prefix frontend; then
            echo "Type check passed"
          else
            echo "Type check not configured or failed; continuing"
          fi
        continue-on-error: true

      - name: Build frontend
        run: |
          if npm run build --prefix frontend; then
            echo "Frontend build passed"
          else
            echo "Frontend build not configured or failed; continuing"
          fi
        continue-on-error: true

      - name: Check frontend file exists
        run: |
          test -d frontend || echo "No frontend directory found"
          test -f frontend/package.json && echo "frontend/package.json found" || echo "frontend/package.json not found"
